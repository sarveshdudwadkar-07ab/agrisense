{% extends 'base.html' %}

{% block content %}
<h2>Your Cart</h2>

<table class="table mt-4">
    <thead>
        <tr>
            <th>Product</th>
            <th>Quantity</th>
            <th>Total</th>
        </tr>
    </thead>
    <tbody>
        {% for item in cart_items %}
        <tr>
            <td>{{ item.product.name }}</td>
            <td>{{ item.quantity }}</td>
            <td>₹{{ item.total_price }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<h4>Total: ₹{{ total }}</h4>

<a href="{% url 'place_order' %}" class="btn btn-success">
    Place Order
</a>

<a href="{% url 'product_list' %}" class="btn btn-secondary">
    Back to Shop
</a>
{% endblock %}
