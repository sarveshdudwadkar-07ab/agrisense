{% extends "base.html" %}

{% block content %}

<style>

/* Layout */
.chat-wrapper{
    height:88vh;
    display:flex;
    flex-direction:column;
    background:#ffffff;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
    overflow:hidden;
}

/* Header */
.chat-header{
    padding:18px;
    background:#198754;
    color:white;
    font-weight:600;
    font-size:18px;
}

/* Messages */
.chat-messages{
    flex:1;
    overflow-y:auto;
    padding:30px;
    background:#f6f8fb;
}

/* Message bubbles */
.message{
    max-width:65%;
    padding:14px 18px;
    border-radius:16px;
    margin-bottom:18px;
    font-size:15px;
    line-height:1.6;
}

/* User */
.user-message{
    margin-left:auto;
    background:#d1f7d6;
}

/* AI */
.ai-message{
    background:white;
    border:1px solid #e8e8e8;
}

/* Input */
.chat-input{
    padding:18px;
    border-top:1px solid #eee;
    background:white;
}

.chat-input textarea{
    border-radius:10px;
    padding:10px;
    resize:none;
}

.send-btn{
    border-radius:10px;
    padding:10px 18px;
}

</style>


<div class="container-fluid">
<div class="row justify-content-center">
<div class="col-lg-10 col-xl-8">

<div class="chat-wrapper">

<!-- HEADER -->
<div class="chat-header">
🤖 AI Farming Assistant
</div>

<!-- CHAT -->
<div class="chat-messages" id="chatBox">

{% for message in messages %}

<div class="message user-message">
<strong>You</strong><br>
{{ message.question }}
</div>

<div class="message ai-message">
<strong>AI</strong><br>
{{ message.answer|linebreaks }}
</div>

{% endfor %}

</div>

<!-- INPUT -->
<div class="chat-input">

<form method="POST" id="chatForm">
{% csrf_token %}

<div class="input-group">

<textarea
name="question"
class="form-control"
rows="1"
placeholder="Ask about crops, soil, pests..."
required></textarea>

<button class="btn btn-success send-btn">
<i class="bi bi-send"></i>
</button>

</div>

</form>

</div>

</div>

</div>
</div>
</div>


<script>

/* Auto scroll */
const chatBox = document.getElementById("chatBox");
chatBox.scrollTop = chatBox.scrollHeight;

/* Loading effect */
const form = document.getElementById("chatForm");

form.addEventListener("submit", function() {
    const loadingDiv = document.createElement("div");
    loadingDiv.className = "message ai-message";
    loadingDiv.innerHTML = "<strong>AI</strong><br>Thinking...";

    chatBox.appendChild(loadingDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
});

</script>

{% endblock %}
